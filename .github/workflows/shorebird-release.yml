name: Shorebird Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - uses: shorebirdtech/setup-shorebird@v1

      - name: Shorebird Release Android APK
        run: shorebird release android --artifact apk
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        working-directory: ./flutter_mobile

      - name: Upload Shorebird APK
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-auto-update-apk
          path: flutter_mobile/build/app/outputs/flutter-apk/app-release.apk
